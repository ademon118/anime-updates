spring.application.name=anime-updates-server
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
server.address=0.0.0.0

# fill these from env file
security.jwt.secret=${JWT_SECRET}
security.jwt.issuer=${JWT_ISSUER}
security.jwt.access-token-ttl-minutes=${ACCESS_TOKEN_TTL_MINUTES}
security.jwt.refresh-token-ttl-days=${REFRESH_TOKEN_TTL_DAYS}
security.token.secret=${TOKEN_SECRET}
android.latest-app-symlink-path=${ANDROID_LATEST_APK_SYMLINK_PATH}

fcm.service-account-key-path=${FCMSERVICEACCKEYPATH}

# Scheduler cron expression (THET HTOO ZAW)
scheduler.deactivate-tokens.cron=0 0 0 * * ?
scheduler.deactivate-tokens.zone=Asia/Yangon

#inactive days threshold
scheduler.deactivate-tokens.inactive-days=14

# Hibernate dialect for MySQL
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# SQL logging off — use logging.level below instead of show-sql
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Application logging (watch party, security, APIs)
logging.level.root=INFO
logging.level.com.aura.anime_updates=DEBUG
logging.level.org.springframework.web.socket=DEBUG
logging.level.org.springframework.messaging.simp=DEBUG

# Silence Hibernate / JDBC noise
logging.level.org.hibernate=WARN
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.orm.jdbc.bind=WARN
logging.level.org.hibernate.type.descriptor.sql=WARN
logging.level.org.springframework.orm.jpa=WARN
logging.level.org.springframework.jdbc=WARN

# Jackson configuration
spring.jackson.serialization.fail-on-empty-beans=false
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.deserialization.fail-on-unknown-properties=false
spring.jackson.serialization.FAIL_ON_SELF_REFERENCES=false

#Swagger
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.tryItOutEnabled=true

server.forward-headers-strategy=framework